[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mouche-tetris"
version = "0.0.0"
description = "Un réseau contraint par le connectome MaleCNS v1.0, entraîné à juger des grilles de Tetris"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

# Le cœur du projet — moteur, expert, encodage, évaluation — ne dépend que de NumPy.
# C'est volontaire : la phase 0 et les tests du moteur tournent sans PyTorch, sans CUDA
# et sans le MaleCNS (conception.md §16).
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Élèves simples et modèle du connectome. La version de PyTorch sera alignée sur celle
# qu'exige flyhard, à trancher en J3 (conception.md §4.1).
modeles = ["torch>=2.0"]
connectome = ["torch>=2.0", "pyarrow>=14", "pandas>=2.0", "scipy>=1.10", "mlflow>=2.9", "pyyaml>=6.0"]
serveur = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "websockets>=12.0"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.3"]

[project.scripts]
mouche = "mouche_tetris.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "connectome: exige le MaleCNS téléchargé — jamais exécuté en intégration continue (§16)",
  "gpu: exige CUDA",
  "lent: plusieurs minutes de CPU",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
